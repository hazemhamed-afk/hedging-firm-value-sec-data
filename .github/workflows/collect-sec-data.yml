name: Collect SEC panel

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/collect-sec-data.yml"
  workflow_dispatch:
    inputs:
      start_year:
        description: "First fiscal year"
        required: true
        default: "2010"
      end_year:
        description: "Last fiscal year"
        required: true
        default: "2025"
      max_firms:
        description: "Maximum eligible firms (test with 25; then use 300-500)"
        required: true
        default: "25"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect SEC panel
        env:
          SEC_USER_AGENT: "hazemhamed-afk@users.noreply.github.com academic research"
        run: |
          START_YEAR="${{ inputs.start_year }}"
          END_YEAR="${{ inputs.end_year }}"
          MAX_FIRMS="${{ inputs.max_firms }}"
          if [ -z "$START_YEAR" ]; then START_YEAR="2010"; fi
          if [ -z "$END_YEAR" ]; then END_YEAR="2025"; fi
          if [ -z "$MAX_FIRMS" ]; then MAX_FIRMS="25"; fi

          python src/collect_sec_panel.py \
            --start-year "$START_YEAR" \
            --end-year "$END_YEAR" \
            --max-firms "$MAX_FIRMS" \
            --outdir data

      - name: Upload data artifact
        uses: actions/upload-artifact@v4
        with:
          name: sec-panel-data
          path: |
            data/sec_financial_panel.csv
            data/sec_firm_metadata.csv
            data/sec_missingness_report.csv
            data/sec_collection_log.csv
          retention-days: 30
